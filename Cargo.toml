[package]
name = "paraseq"
version = "0.4.14"
edition = "2021"
authors = ["Noam Teyssier"]
keywords = ["fasta", "fastq", "parser", "parallel", "paired"]
license = "MIT"
repository = "https://github.com/noamteyssier/paraseq"
description = "A minimal-copy parser for FASTA and FASTQ files built for paired parallel processing."
readme = "README.md"
documentation = "https://docs.rs/paraseq"

[dependencies]
anyhow = { version = "1.0.95", optional = true }
aws-config = { version = "1.10.1", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.140.0", optional = true, default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.2.0", optional = true, default-features = false, features = ["rustls-ring"] }
bytes = { version = "1.12.1", optional = true }
crossbeam-channel = "0.5.14"
either = "1.15.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.29"
memchr = "2.7.4"
niffler = { version = "3.0.0", optional = true, default-features = false }
num_cpus = "1.17.0"
parking_lot = "0.12.3"
reqwest = { version = "0.12.22", optional = true, features = ["blocking"] }
rust-htslib = { version = "0.49.0", default-features = false, optional = true }
smallvec = "1.15.1"
thiserror = "2.0.11"
tokio = { version = "1.53.1", optional = true, features = ["rt-multi-thread", "sync"] }
which = { version = "8.0.0", optional = true }

[features]
default = ["anyhow", "niffler", "niffler/default"]
anyhow = ["dep:anyhow"]
niffler = ["dep:niffler"]
htslib = ["dep:rust-htslib"]
url = ["dep:reqwest", "dep:niffler"]
ssh = ["dep:which"]
gcs = ["dep:which"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:bytes", "dep:tokio", "dep:niffler"]

[dev-dependencies]
clap = { version = "4.5.40", features = ["derive"] }
niffler = "3.0.0"
# `s3` is deliberately omitted: including it here would compile the whole AWS
# stack on every `cargo test`, even when nothing touches S3. Run the S3 tests
# and example with `--features s3`.
paraseq = { path = ".", features = ["url", "htslib", "ssh", "gcs"] }

# Needs the `s3` feature, which is not on by default for dev builds.
[[example]]
name = "s3"
required-features = ["s3"]
